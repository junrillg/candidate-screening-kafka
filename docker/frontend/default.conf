server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;
    access_log off;
    error_log /dev/stderr crit;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control no-store always;

    location = /health {
        default_type text/plain;
        return 200 "ready\n";
    }
    location /api/ {
        set $api_upstream candidates:8080;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 20s;
        proxy_read_timeout 75s;
    }
    location /internal/ {
        return 404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
