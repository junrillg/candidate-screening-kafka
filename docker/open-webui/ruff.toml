# Same profile as the pinned upstream pyproject and Ruff pre-commit hook.
required-version = "==0.15.5"
target-version = "py311"
line-length = 120

[format]
quote-style = "single"
docstring-code-format = false

[lint]
select = ["E", "F", "W", "I", "UP", "C90", "Q", "ICN"]
flake8-import-conventions.banned-from = ["ast", "datetime"]
flake8-import-conventions.aliases = { datetime = "dt" }
flake8-quotes.inline-quotes = "single"
mccabe.max-complexity = 10
pydocstyle.convention = "google"
