[mypy]
python_version = 3.11
files = docker/open-webui/runtime_installer.py, docker/open-webui/test_runtime_installer.py
strict = True
warn_unreachable = True
show_error_codes = True
pretty = False
incremental = False

# These overrides apply to a separate explicit legacy-body diagnostic invocation.
# The default file scope above does not claim those interfaces are fully typed.
[mypy-check]
disallow_untyped_defs = False
disallow_untyped_calls = False
disallow_incomplete_defs = True
check_untyped_defs = True

[mypy-native_check]
disallow_untyped_defs = False
disallow_untyped_calls = False
disallow_incomplete_defs = True
check_untyped_defs = True
